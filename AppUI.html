<!--
  ARCHIVO: AppUI.html

  Coordinador principal del frontend.

  Responsabilidad:
  - Inicializar la aplicación.
  - Mostrar la vista inicial.
  - Coordinar el arranque de los módulos de interfaz.

  No debe contener:
  - HTML de listas de clientes.
  - Formularios.
  - Ficha de cliente.
  - Lógica específica de clientes.
  - Lógica específica de eventos.
  - Acceso directo al backend para operaciones de negocio.
  - CSS.
-->

<script>

  const AppUI = {

    /**
     * Inicializa la aplicación.
     */
    iniciar() {

      this.irAClientes();
    },


    /**
     * Muestra la sección de Clientes (listado) y marca su pestaña.
     */
    irAClientes() {

      this._activarTab('clientes');

      NavegacionUI.mostrar('clientes');

      ClienteListaUI.cargar();
    },


    /**
     * Muestra la sección de Ventas (listado) y marca su pestaña.
     */
    irAVentas() {

      this._activarTab('ventas');

      NavegacionUI.mostrar('ventas');

      VentaListaUI.cargar();
    },


    /**
     * Resalta la pestaña activa en el header.
     *
     * @param {string} seccion 'clientes' | 'ventas'
     */
    _activarTab(seccion) {

      const tabClientes =
        document.getElementById('nav-clientes');

      const tabVentas =
        document.getElementById('nav-ventas');

      if (tabClientes) {
        tabClientes.classList.toggle(
          'nav-tab-activo',
          seccion === 'clientes'
        );
      }

      if (tabVentas) {
        tabVentas.classList.toggle(
          'nav-tab-activo',
          seccion === 'ventas'
        );
      }
    }

  };


  /**
   * Iniciar la aplicación cuando el documento esté listo.
   */
  document.addEventListener(
    'DOMContentLoaded',
    () => AppUI.iniciar()
  );

</script>
