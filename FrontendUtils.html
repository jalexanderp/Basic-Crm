<!--
  ARCHIVO: FrontendUtils.html

  Utilidades comunes del frontend.

  Responsabilidad:
  - Escapar valores antes de insertarlos en HTML.
  - Proporcionar pequeñas utilidades reutilizables.

  No debe contener:
  - lógica de clientes.
  - lógica de eventos.
  - acceso al backend.
  - navegación.
-->

<script>

  const FrontendUtils = {

    /**
     * Escapa un valor para insertarlo como texto HTML.
     *
     * @param {*} valor
     * @returns {string}
     */
    escaparHtml(valor) {

      return String(valor ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    },


    /**
     * Devuelve un texto o un guion cuando el valor está vacío.
     *
     * @param {*} valor
     * @returns {string}
     */
    textoOGrion(valor) {

      const texto = String(valor ?? '').trim();

      return texto || '—';
    },


    /**
     * Devuelve el HTML de un badge de color según el estado del cliente.
     *
     * Verde   -> "Cliente" (ya se le vendió)
     * Amarillo-> "Seguimiento" / "En seguimiento" / "Lead" / "Prospecto"
     * Rojo    -> "Perdido" / "Desistió" / "Descartado"
     * Gris    -> cualquier otro valor
     *
     * El texto mostrado es el propio valor de tipoCliente (escapado).
     *
     * @param {string} tipoCliente
     * @returns {string} HTML del badge, o '' si no hay valor.
     */
    badgeEstadoCliente(tipoCliente) {

      const texto = String(tipoCliente == null ? '' : tipoCliente).trim();

      if (!texto) {
        return '';
      }

      // Normalizar para comparar (sin acentos, minúsculas).
      let clave = texto.toLowerCase();
      try {
        clave = clave.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
      } catch (e) {
        // Si normalize no está disponible, seguimos con la cadena base.
      }

      let clase = 'badge-gris';

      if (clave.indexOf('cliente') !== -1) {
        clase = 'badge-verde';
      } else if (
        clave.indexOf('seguimiento') !== -1 ||
        clave.indexOf('lead') !== -1 ||
        clave.indexOf('prospecto') !== -1
      ) {
        clase = 'badge-amarillo';
      } else if (
        clave.indexOf('perdid') !== -1 ||
        clave.indexOf('desist') !== -1 ||
        clave.indexOf('descart') !== -1
      ) {
        clase = 'badge-rojo';
      }

      return '<span class="badge ' + clase + '">' +
        this.escaparHtml(texto) +
        '</span>';
    },


    /**
     * Formatea un valor numérico como moneda colombiana: "$ 45.000.000".
     * Si el valor está vacío o no es numérico, devuelve ''.
     *
     * @param {*} valor
     * @returns {string}
     */
    formatearMoneda(valor) {

      if (valor === null || valor === undefined || valor === '') {
        return '';
      }

      // Aceptar números o cadenas con separadores.
      const limpio = String(valor)
        .replace(/[^\d.,-]/g, '')
        .replace(/\.(?=\d{3}(\D|$))/g, '')
        .replace(/,/g, '.');

      const n = Number(limpio);

      if (isNaN(n)) {
        return '';
      }

      return '$ ' + n.toLocaleString('es-CO', {
        maximumFractionDigits: 0
      });
    },


    /**
     * Convierte el comentario de un evento en HTML seguro.
     *
     * Los eventos automáticos guardan el comentario con el formato:
     *   "<mensaje>\n\nEnviar por WhatsApp: <url>"
     *
     * Esta función:
     * - Escapa el texto del mensaje (seguro contra HTML).
     * - Reemplaza la URL cruda de WhatsApp por un enlace clickeable
     *   "Enviar por WhatsApp" que abre en una pestaña nueva.
     * - Respeta los saltos de línea del mensaje.
     *
     * Si el comentario no contiene un link de WhatsApp, simplemente
     * devuelve el texto escapado con sus saltos de línea.
     *
     * @param {string} comentario
     * @returns {string} HTML listo para insertar.
     */
    comentarioAHtml(comentario) {

      const texto = String(comentario ?? '').trim();

      if (!texto) {
        return '—';
      }

      // Detectar el link de WhatsApp dentro del comentario.
      // Formato esperado: "...Enviar por WhatsApp: https://..."
      const patron =
        /Enviar por WhatsApp:\s*(https?:\/\/\S+)/i;

      const coincidencia = texto.match(patron);

      if (!coincidencia) {
        // No hay link: devolver el texto escapado con saltos de línea.
        return this.escaparHtml(texto)
          .replace(/\n/g, '<br>');
      }

      const url = coincidencia[1];

      // Parte del mensaje (antes del "Enviar por WhatsApp:").
      const mensaje = texto
        .substring(0, coincidencia.index)
        .trim();

      const mensajeHtml = this.escaparHtml(mensaje)
        .replace(/\n/g, '<br>');

      // El href se escapa para atributo (comillas), la URL es de confianza
      // porque la genera el propio backend.
      const urlSegura = this.escaparHtml(url);

      const enlace = `
        <a
          href="${urlSegura}"
          target="_blank"
          rel="noopener noreferrer"
          class="enlace-whatsapp"
        >
          Enviar por WhatsApp
        </a>
      `;

      return `${mensajeHtml}<br><br>${enlace}`;
    }

  };

</script>
