<!--
  ARCHIVO: CSS.html

  Estilos globales del CRM.

  Responsabilidad:
  - Definir la apariencia general de la aplicación.
  - Mantener un diseño mobile-first.
  - Proporcionar componentes visuales reutilizables.

  No debe contener:
  - HTML de pantallas.
  - JavaScript.
  - lógica de negocio.
  - lógica de navegación.
-->

<style>

  /* ============================================================
     VARIABLES
     ============================================================ */

  :root {
    --color-primary: #1769aa;
    --color-primary-dark: #0f4f82;
    --color-secondary: #eef3f8;
    --color-accent: #f4a340;

    --color-success: #238636;
    --color-warning: #b7791f;
    --color-danger: #c62828;

    --color-background: #f4f7fb;
    --color-surface: #ffffff;

    --color-text: #17212b;
    --color-text-muted: #667085;

    --color-border: #dce3eb;
    --color-border-light: #e9eef4;

    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 16px;

    --shadow-sm:
      0 2px 6px rgba(16, 24, 40, 0.06);

    --shadow-card:
      0 4px 14px rgba(16, 24, 40, 0.07);

    --shadow-focus:
      0 0 0 3px rgba(23, 105, 170, 0.14);

    --spacing-xs: 4px;
    --spacing-sm: 8px;
    --spacing-md: 16px;
    --spacing-lg: 24px;
    --spacing-xl: 32px;
    --spacing-2xl: 40px;

    --content-max-width: 1100px;

    --control-height: 44px;
  }


  /* ============================================================
     RESET / BASE
     ============================================================ */

  *,
  *::before,
  *::after {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    padding: 0;
    min-height: 100%;
  }

  body {
    font-family:
      Arial,
      Helvetica,
      sans-serif;

    background: var(--color-background);
    color: var(--color-text);

    font-size: 16px;
    line-height: 1.5;

    -webkit-text-size-adjust: 100%;
  }

  button,
  input,
  textarea,
  select {
    font: inherit;
  }

  button,
  a {
    -webkit-tap-highlight-color: transparent;
  }

  a {
    color: inherit;
  }

  h1,
  h2,
  h3,
  h4,
  p {
    overflow-wrap: anywhere;
  }

  h2,
  h3,
  h4 {
    color: var(--color-text);
  }

  h2 {
    margin-top: 0;
    margin-bottom: var(--spacing-lg);
    font-size: clamp(22px, 4vw, 28px);
    line-height: 1.25;
  }

  h3 {
    margin-top: var(--spacing-xl);
    margin-bottom: var(--spacing-md);
    font-size: 18px;
    line-height: 1.3;
  }

  h4 {
    font-size: 16px;
  }

  hr {
    border: 0;
    border-top: 1px solid var(--color-border-light);
    margin: var(--spacing-xl) 0;
  }


  /* ============================================================
     APLICACIÓN
     ============================================================ */

  #app {
    min-height: 100vh;
  }

  #app-header {
    background:
      linear-gradient(
        135deg,
        var(--color-primary),
        #2186c4
      );

    color: #ffffff;

    padding:
      14px
      var(--spacing-md);

    box-shadow:
      0 2px 10px rgba(15, 79, 130, 0.18);
  }

  #app-header h1 {
    max-width: var(--content-max-width);

    margin: 0 auto;

    font-size: 21px;
    font-weight: 700;
    line-height: 1.2;
  }

  #app-content {
    width: 100%;
    max-width: var(--content-max-width);

    margin: 0 auto;

    padding:
      var(--spacing-lg)
      var(--spacing-md)
      48px;
  }


  /* ============================================================
     CABECERAS DE VISTA
     ============================================================ */

  .vista-header {
    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: var(--spacing-md);

    margin-bottom: var(--spacing-lg);

    flex-wrap: wrap;
  }

  .vista-title {
    margin: 0;

    font-size: clamp(22px, 5vw, 28px);
    font-weight: 700;
    line-height: 1.2;
  }

  .vista-subtitle {
    margin: 4px 0 0;

    color: var(--color-text-muted);

    font-size: 14px;
  }


  /* ============================================================
     LAYOUT
     ============================================================ */

  .stack {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-md);
  }

  .acciones {
    display: flex;
    align-items: center;

    gap: var(--spacing-sm);

    flex-wrap: wrap;
  }

  .grid-form {
    display: grid;

    grid-template-columns: 1fr;

    gap:
      0
      var(--spacing-lg);
  }

  .full-width {
    grid-column: 1 / -1;
  }


  /* ============================================================
     BOTONES
     ============================================================ */

  .btn {
    display: inline-flex;

    align-items: center;
    justify-content: center;

    gap: 6px;

    min-height: var(--control-height);

    padding:
      10px
      16px;

    border: 1px solid transparent;
    border-radius: var(--radius-md);

    cursor: pointer;

    font-weight: 700;
    line-height: 1.2;

    text-decoration: none;

    transition:
      background-color 0.15s ease,
      border-color 0.15s ease,
      box-shadow 0.15s ease,
      transform 0.1s ease,
      opacity 0.15s ease;
  }

  .btn:hover:not(:disabled) {
    transform: translateY(-1px);
  }

  .btn:active:not(:disabled) {
    transform: translateY(0);
  }

  .btn:focus-visible {
    outline: none;
    box-shadow: var(--shadow-focus);
  }

  .btn-primary {
    background: var(--color-primary);
    color: #ffffff;
  }

  .btn-primary:hover:not(:disabled) {
    background: var(--color-primary-dark);
  }

  .btn-secondary {
    background: var(--color-secondary);
    color: var(--color-text);

    border-color: var(--color-border);
  }

  .btn-secondary:hover:not(:disabled) {
    background: #e3ebf3;
  }

  .btn-danger {
    background: var(--color-danger);
    color: #ffffff;
  }

  .btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
  }


  /* ============================================================
     TARJETAS
     ============================================================ */

  .card {
    background: var(--color-surface);

    border:
      1px solid
      var(--color-border);

    border-radius: var(--radius-lg);

    box-shadow: var(--shadow-card);

    padding: var(--spacing-lg);
  }

  .card + .card {
    margin-top: var(--spacing-md);
  }


  /* ============================================================
     CLIENTES
     ============================================================ */

  .cliente-card {
    margin-bottom: var(--spacing-md);

    cursor: pointer;

    transition:
      transform 0.15s ease,
      box-shadow 0.15s ease,
      border-color 0.15s ease;
  }

  .cliente-card:hover {
    transform: translateY(-2px);

    border-color: #c5d7e8;

    box-shadow:
      0 7px 18px
      rgba(16, 24, 40, 0.10);
  }

  .cliente-card:focus-within {
    border-color: var(--color-primary);
  }

  .cliente-card-nombre {
    margin: 0 0 6px;

    font-size: 17px;
    font-weight: 700;
    line-height: 1.3;
  }

  .cliente-card-info {
    margin: 5px 0;

    color: var(--color-text-muted);

    font-size: 14px;
  }


  /* ============================================================
     BADGES
     ============================================================ */

  .badge {
    display: inline-flex;

    align-items: center;
    justify-content: center;

    min-height: 28px;

    padding:
      4px
      9px;

    border-radius: 999px;

    font-size: 13px;
    font-weight: 700;

    white-space: nowrap;
  }

  .badge-success {
    background: #e9f7ed;
    color: var(--color-success);
  }

  .badge-warning {
    background: #fff5df;
    color: var(--color-warning);
  }

  .badge-error {
    background: #fdecec;
    color: var(--color-danger);
  }


  /* ============================================================
     FORMULARIOS
     ============================================================ */

  .form-group {
    margin-bottom: var(--spacing-md);
  }

  .form-label {
    display: block;

    margin-bottom: 6px;

    color: var(--color-text);

    font-weight: 700;
    line-height: 1.3;
  }

  .form-required {
    color: var(--color-danger);
  }

  input,
  textarea,
  select {
    width: 100%;

    min-height: var(--control-height);

    padding:
      10px
      12px;

    border:
      1px solid
      var(--color-border);

    border-radius: var(--radius-md);

    background: var(--color-surface);
    color: var(--color-text);

    font: inherit;

    transition:
      border-color 0.15s ease,
      box-shadow 0.15s ease;
  }

  input::placeholder,
  textarea::placeholder {
    color: #98a2b3;
  }

  textarea {
    min-height: 100px;
    resize: vertical;
  }

  input:hover,
  textarea:hover,
  select:hover {
    border-color: #b9c5d1;
  }

  input:focus,
  textarea:focus,
  select:focus {
    outline: none;

    border-color: var(--color-primary);

    box-shadow: var(--shadow-focus);
  }

  input:disabled,
  textarea:disabled,
  select:disabled {
    background: #f2f4f7;
    cursor: not-allowed;
  }

  .field-error {
    margin-top: 5px;

    color: var(--color-danger);

    font-size: 14px;
    line-height: 1.4;
  }


  /* ============================================================
     BLOQUE DE SEGUIMIENTO
     ============================================================ */

  .seguimiento-info {
    margin-bottom: var(--spacing-lg);

    padding: var(--spacing-md);

    border:
      1px solid
      #d7e7f4;

    border-radius: var(--radius-md);

    background:
      #f0f7fc;

    color: var(--color-text);
  }

  .seguimiento-info strong {
    display: block;

    margin-bottom: 4px;

    color: var(--color-primary-dark);
  }

  .seguimiento-info-text {
    margin: 0;

    color: var(--color-text-muted);

    font-size: 14px;
  }


  /* ============================================================
     MENSAJES
     ============================================================ */

  .mensaje {
    padding:
      12px
      14px;

    border:
      1px solid
      transparent;

    border-radius: var(--radius-md);

    margin-bottom: var(--spacing-md);

    line-height: 1.4;
  }

  .mensaje-error {
    background: #fff0f0;
    color: var(--color-danger);

    border-color: #f3caca;
  }

  .mensaje-success {
    background: #edf8f0;
    color: var(--color-success);

    border-color: #c9e8d0;
  }


  /* ============================================================
     ESTADOS
     ============================================================ */

  .estado-vacio {
    padding:
      var(--spacing-xl)
      var(--spacing-md);

    text-align: center;

    color: var(--color-text-muted);

    background: var(--color-surface);

    border:
      1px dashed
      var(--color-border);

    border-radius: var(--radius-lg);
  }

  .loading {
    padding: var(--spacing-xl);

    text-align: center;

    color: var(--color-text-muted);

    background: var(--color-surface);

    border-radius: var(--radius-md);
  }


  /* ============================================================
     HISTORIAL / EVENTOS
     ============================================================ */

  #historial-cliente > .card {
    margin-top: var(--spacing-md);
  }

  #historial-cliente .card p {
    margin-top: 10px;
    margin-bottom: 10px;
  }

  #historial-cliente small {
    color: var(--color-text-muted);
  }


  /* ============================================================
     RESPONSIVE — MÓVIL PEQUEÑO
     ============================================================ */

  @media (max-width: 479px) {

    #app-header {
      padding:
        13px
        var(--spacing-md);
    }

    #app-header h1 {
      font-size: 20px;
    }

    #app-content {
      padding:
        var(--spacing-md)
        12px
        36px;
    }

    .card {
      padding: var(--spacing-md);

      border-radius: var(--radius-md);
    }

    .vista-header {
      align-items: stretch;
    }

    .vista-header .acciones {
      width: 100%;
    }

    .vista-header .acciones .btn {
      flex: 1 1 auto;
    }

    .acciones {
      width: 100%;
    }

    .acciones .btn {
      flex: 1 1 auto;
    }

    .btn {
      min-height: 44px;
    }
  }


  /* ============================================================
     RESPONSIVE — MÓVIL AMPLIO
     ============================================================ */

  @media (min-width: 480px) {

    #app-content {
      padding:
        var(--spacing-lg)
        var(--spacing-md)
        48px;
    }

  }


  /* ============================================================
     RESPONSIVE — TABLET
     ============================================================ */

  @media (min-width: 768px) {

    #app-header {
      padding:
        18px
        var(--spacing-lg);
    }

    #app-header h1 {
      font-size: 23px;
    }

    #app-content {
      padding:
        var(--spacing-xl)
        var(--spacing-lg)
        56px;
    }

    .grid-form {
      grid-template-columns:
        minmax(0, 1fr)
        minmax(0, 1fr);
    }

    .form-group.full-width {
      grid-column: 1 / -1;
    }

    .card {
      padding: var(--spacing-xl);
    }

  }


  /* ============================================================
     RESPONSIVE — ESCRITORIO
     ============================================================ */

  @media (min-width: 1024px) {

    #app-content {
      padding-top: 36px;
    }

    .vista-title {
      font-size: 28px;
    }

  }


  /* ============================================================
     ACCESIBILIDAD / REDUCCIÓN DE MOVIMIENTO
     ============================================================ */

  @media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {
      scroll-behavior: auto !important;
      transition-duration: 0.01ms !important;
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
    }

  }

</style>
