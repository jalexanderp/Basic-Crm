<!--
  ARCHIVO: ClienteListaUI.html

  Interfaz de la lista de clientes.

  Responsabilidad:
  - Cargar clientes desde el backend.
  - Mostrar clientes.
  - Filtrar por nombre o celular.
  - Abrir la ficha de un cliente.
  - Mostrar estados de carga y lista vacía.

  No debe contener:
  - lógica de Google Sheets.
  - lógica de negocio.
  - formulario de cliente.
  - ficha de cliente.
  - lógica de eventos.
  - sistema de navegación.
  - CSS global.
-->

<script>

  const ClienteListaUI = {

    // Todos los clientes cargados desde el backend.
    clientes: [],

    // Lista actualmente visible (según paginación o búsqueda).
    clientesFiltrados: [],

    // Cuántos clientes mostrar por página / paso de "Ver más".
    TAMANO_PAGINA: 5,

    // Cuántos se están mostrando actualmente (para el modo listado).
    mostrados: 5,

    // Indica si estamos en modo búsqueda (true) o listado normal (false).
    enBusqueda: false,


    cargar() {

      this.mostrarCargando();

      google.script.run
        .withSuccessHandler(
          this._cargaExitosa.bind(this)
        )
        .withFailureHandler(
          this._cargaFallida.bind(this)
        )
        .apiObtenerClientes();
    },


    _cargaExitosa(clientes) {

      this.clientes = Array.isArray(clientes)
        ? clientes
        : [];

      this.enBusqueda = false;
      this.mostrados = this.TAMANO_PAGINA;

      this._renderizarListado();
    },


    /**
     * Renderiza el listado paginado (los primeros "mostrados" clientes)
     * junto con el botón "Ver más" si quedan más por mostrar.
     */
    _renderizarListado() {

      this.clientesFiltrados =
        this.clientes.slice(0, this.mostrados);

      this.mostrar(this.clientesFiltrados);

      this._actualizarBotonVerMas();
    },


    /**
     * Muestra u oculta el botón "Ver más" según queden más clientes.
     */
    _actualizarBotonVerMas() {

      const contenedor = this._obtenerContenedor();
      if (!contenedor) {
        return;
      }

      // En modo búsqueda no paginamos: no hay botón "Ver más".
      const quedanMas =
        !this.enBusqueda &&
        this.clientes.length > this.mostrados;

      let boton = document.getElementById('btn-ver-mas');

      if (quedanMas) {
        if (!boton) {
          boton = document.createElement('button');
          boton.id = 'btn-ver-mas';
          boton.type = 'button';
          boton.className = 'btn btn-secondary';
          boton.style.marginTop = '12px';
          boton.style.width = '100%';
          boton.textContent = 'Ver más';
          boton.onclick = () => ClienteListaUI.verMas();
          contenedor.parentNode.appendChild(boton);
        }
        boton.hidden = false;
      } else if (boton) {
        boton.hidden = true;
      }
    },


    /**
     * Muestra los siguientes clientes (incrementa la página).
     */
    verMas() {

      this.mostrados += this.TAMANO_PAGINA;
      this._renderizarListado();
    },


    _cargaFallida(error) {

      const contenedor =
        this._obtenerContenedor();

      if (!contenedor) {
        return;
      }

      const mensaje =
        error && error.message
          ? error.message
          : 'No fue posible cargar los clientes.';

      contenedor.innerHTML = `
        <div class="mensaje mensaje-error">
          ${FrontendUtils.escaparHtml(mensaje)}
        </div>
      `;
    },


    mostrar(clientes) {

      const contenedor =
        this._obtenerContenedor();

      if (!contenedor) {
        return;
      }

      if (!clientes.length) {

        contenedor.innerHTML = `
          <div class="estado-vacio">
            No hay clientes para mostrar.
          </div>
        `;

        return;
      }

      contenedor.innerHTML = clientes
        .map(cliente => this._crearTarjeta(cliente))
        .join('');
    },


    _crearTarjeta(cliente) {

      const idCliente =
        FrontendUtils.escaparHtml(
          cliente.idCliente
        );

      const nombre =
        FrontendUtils.escaparHtml(
          cliente.nombreCompleto
        );

      const celular =
        FrontendUtils.escaparHtml(
          cliente.celular
        );

      const vehiculo =
        FrontendUtils.escaparHtml(
          cliente.primerVehiculoInteres
        );

      const badgeEstado =
        FrontendUtils.badgeEstadoCliente(
          cliente.estadoCalculado
        );

      return `
        <article
          class="card cliente-card"
          data-id-cliente="${idCliente}"
          onclick="ClienteListaUI.abrirCliente('${idCliente}')"
        >

          <div
            style="
              display:flex;
              justify-content:space-between;
              align-items:flex-start;
              gap:8px;
            "
          >
            <h3 class="cliente-card-nombre" style="margin:0;">
              ${nombre}
            </h3>
            ${badgeEstado}
          </div>

          <p class="cliente-card-info">
            ${celular}
          </p>

          <p class="cliente-card-info">
            ${vehiculo}
          </p>

          ${this._crearProximoEvento(cliente.proximoEvento)}

        </article>
      `;
    },


    /**
     * Genera el bloque del próximo evento del cliente (si existe).
     *
     * @param {Object|null} evento
     * @returns {string}
     */
    _crearProximoEvento(evento) {

      if (!evento) {
        return '';
      }

      const tipo =
        FrontendUtils.escaparHtml(evento.tipoEvento || 'Evento');

      const fecha =
        FrontendUtils.escaparHtml(evento.fechaEvento || '');

      const hora =
        FrontendUtils.escaparHtml(evento.horaEvento || '');

      const comentario =
        FrontendUtils.escaparHtml(evento.comentario || '');

      // Recortar comentario largo para la tarjeta.
      const comentarioCorto =
        comentario.length > 90
          ? comentario.substring(0, 90) + '…'
          : comentario;

      return `
        <div class="proximo-evento">
          <div class="proximo-evento-tipo">
            ${tipo}
          </div>
          <div class="proximo-evento-fecha">
            ${fecha}${hora ? ' · ' + hora : ''}
          </div>
          ${
            comentarioCorto
              ? `<div class="proximo-evento-comentario">${comentarioCorto}</div>`
              : ''
          }
        </div>
      `;
    },


    filtrar() {

      const input =
        document.getElementById(
          'buscar-clientes'
        );

      if (!input) {
        return;
      }

      const termino =
        input.value.trim();

      /*
       * Si no hay búsqueda, volvemos al modo listado paginado
       * (los primeros clientes + botón "Ver más").
       */
      if (!termino) {

        this.enBusqueda = false;
        this.mostrados = this.TAMANO_PAGINA;
        this._renderizarListado();

        return;
      }

      /*
       * La búsqueda se realiza en todo Sheets.
       *
       * Esto permite encontrar clientes que todavía
       * no forman parte de los registros iniciales.
       */
      this.enBusqueda = true;
      this.mostrarCargando();

      google.script.run
        .withSuccessHandler(
          this._busquedaExitosa.bind(this)
        )
        .withFailureHandler(
          this._cargaFallida.bind(this)
        )
        .apiBuscarClientes(
          termino
        );
    },


    _busquedaExitosa(clientes) {

      this.clientesFiltrados =
        Array.isArray(clientes)
          ? clientes
          : [];

      // En búsqueda mostramos todos los resultados (sin paginación).
      this.mostrar(this.clientesFiltrados);

      // Ocultamos el botón "Ver más" mientras hay búsqueda activa.
      this._actualizarBotonVerMas();
    },


    /**
     * Actualiza en memoria los datos de un cliente que ya fue cargado
     * en la lista (por ejemplo tras editarlo), sin volver a consultar
     * el backend. Si el cliente no está en la lista actual, no hace nada.
     *
     * @param {Object} cliente Cliente actualizado.
     */
    actualizarCliente(cliente) {

      if (!cliente || !cliente.idCliente) {
        return;
      }

      // Actualizar la copia dentro de la lista completa.
      const indice = this.clientes.findIndex(
        c => c.idCliente === cliente.idCliente
      );

      if (indice === -1) {
        // El cliente no está en la lista cargada; nada que actualizar.
        return;
      }

      this.clientes[indice] = cliente;

      // Si no estamos en búsqueda, re-renderizar el listado paginado
      // para reflejar el cambio en la tarjeta.
      if (!this.enBusqueda) {
        this._renderizarListado();
      }
    },


    abrirCliente(idCliente) {

      if (!idCliente) {
        return;
      }

      ClienteFichaUI.cargar(
        idCliente
      );
    },


    mostrarCargando() {

      const contenedor =
        this._obtenerContenedor();

      if (!contenedor) {
        return;
      }

      contenedor.innerHTML = `
        <div class="loading">
          Cargando clientes...
        </div>
      `;

      // Ocultar el botón "Ver más" mientras se carga.
      const boton = document.getElementById('btn-ver-mas');
      if (boton) {
        boton.hidden = true;
      }
    },


    _obtenerContenedor() {

      return document.getElementById(
        'lista-clientes'
      );
    }

  };

</script>
