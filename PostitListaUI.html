<script>

  const PostitListaUI = {

    cargar() {
      google.script.run
        .withSuccessHandler(this._mostrarPostits)
        .withFailureHandler(this._error)
        .apiObtenerPostits(0, 5);
    },

    _mostrarPostits(data) {
      const container = document.getElementById('lista-notas');
      if (!container) return;
      const postits = data.postits || [];
      if (postits.length === 0) {
        container.innerHTML = '<p class="no-data">No hay notas. ¡Crea tu primera nota!</p>';
        return;
      }
      let html = '<div class="postits-grid">';
      postits.forEach(p => {
        const fecha = this._formatearFecha(p.fecha);
        const cliente = p.idCliente ? '<span class="postit-cliente">👤 ' + p.idCliente + '</span>' : '';
        html += '<div class="postit-card">';
        html += '  <div class="postit-header">';
        html += '    <span class="postit-id">' + p.idPostit + '</span>';
        html += '    <div class="postit-actions">';
        html += '      <button class="btn btn-sm btn-primary" onclick="PostitListaUI.editar(\\'' + p.idPostit + '\\')">✏️</button>';
        html += '      <button class="btn btn-sm btn-danger" onclick="PostitListaUI.archivar(\\'' + p.idPostit + '\\')">📦</button>';
        html += '    </div></div>';
        html += '  <div class="postit-body"><div class="postit-description">' + p.descripcion + '</div></div>';
        html += '  <div class="postit-footer"><span class="postit-date">📅 ' + fecha + '</span>' + cliente + '</div></div>';
      });
      html += '</div>';
      container.innerHTML = html;
    },

    filtrar() {
      const termino = document.getElementById('buscar-notas').value;
      if (termino.trim() === '') { this.cargar(); return; }
      google.script.run.withSuccessHandler(this._mostrarFiltrados).withFailureHandler(this._error).apiBuscarPostits(termino);
    },


    nueva() {
      const dialog = google.script.showModalDialog().setTitle('Nueva Nota').setHeight(600);
      const html = '<!DOCTYPE html><html><head><base target="_top"><style>body{font-family:Roboto,sans-serif;padding:20px}.form-group{margin-bottom:15px}label{display:block;margin-bottom:5px;font-weight:500}textarea{width:100%;padding:10px;border:1px solid #ddd;border-radius:4px;min-height:150px;font-family:inherit}.btn{padding:10px 20px;border:none;border-radius:4px;cursor:pointer;font-size:14px}.btn-primary{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}.btn-secondary{background:#6c757d;color:#fff}.buttons{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}</style></head><body><h2>Nueva Nota</h2><div class="form-group"><label>Descripción:</label><textarea id="descripcion" placeholder="Escribe tu nota aquí..."></textarea></div><div class="buttons"><button class="btn btn-secondary" onclick="google.script.host.close()">Cancelar</button><button class="btn btn-primary" onclick="PostitListaUI.guardarNota()">Guardar</button></div><script>PostitListaUI.guardarNota=function(){const d=document.getElementById("descripcion").value.trim();if(!d){alert("La descripción es obligatoria");return}google.script.run.withSuccessHandler(()=>google.script.host.close()).withFailureHandler(e=>alert("Error: "+e)).apiCrearPostit({descripcion:d})}<\\/script></body></html>';
      dialog.setContent(html);
    },

    guardarNota() {
      const descripcion = document.getElementById('descripcion').value.trim();
      if (!descripcion) { alert('La descripción es obligatoria'); return; }
      google.script.run.withSuccessHandler(()=>google.script.host.close()).withFailureHandler(e=>alert("Error: "+e)).apiCrearPostit({descripcion:descripcion});
    },

    editar(id) {
      google.script.run.withSuccessHandler(p => {
        if (!p) { alert('Postit no encontrado'); return; }
        const dialog = google.script.showModalDialog().setTitle('Editar Nota').setHeight(600);
        const html = '<!DOCTYPE html><html><head><base target="_top"><style>body{font-family:Roboto,sans-serif;padding:20px}.form-group{margin-bottom:15px}label{display:block;margin-bottom:5px;font-weight:500}textarea{width:100%;padding:10px;border:1px solid #ddd;border-radius:4px;min-height:150px;font-family:inherit}.btn{padding:10px 20px;border:none;border-radius:4px;cursor:pointer;font-size:14px}.btn-primary{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}.btn-secondary{background:#6c757d;color:#fff}.buttons{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}</style></head><body><h2>Editar Nota</h2><div class="form-group"><label>Descripción:</label><textarea id="descripcion">' + p.descripcion + '</textarea></div><div class="buttons"><button class="btn btn-secondary" onclick="google.script.host.close()">Cancelar</button><button class="btn btn-primary" onclick="PostitListaUI.actualizarNota(\\'' + id + '\\')">Guardar</button></div><script>PostitListaUI.actualizarNota=function(id){const d=document.getElementById("descripcion").value.trim();if(!d){alert("La descripción es obligatoria");return}google.script.run.withSuccessHandler(()=>google.script.host.close()).withFailureHandler(e=>alert("Error: "+e)).apiActualizarPostit({idPostit:id,descripcion:d})}<\\/script></body></html>';
        dialog.setContent(html);
      }).withFailureHandler(this._error).apiObtenerPostit(id);
    },

    archivar(id) {
      if (!confirm('¿Quieres archivar esta nota?')) return;
      google.script.run.withSuccessHandler(()=>this.cargar()).withFailureHandler(this._error).apiArchivarPostit(id);
    },

    _formatearFecha(fecha) {
      if (!fecha) return '';
      const d = fecha instanceof Date ? fecha : new Date(fecha);
      return d.toLocaleString('es-ES', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
    },

    _error(error) {
      alert('Error: ' + (error.message || error));
    }
  };

</script>
