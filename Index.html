  - grandes bloques de JavaScript.

<!DOCTYPE html>
<html lang="es">

<head>

  <base target="_top">

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>CRM</title>

  <?!= include('CSS'); ?>

</head>

<body>

  <div id="app">

    <header id="app-header">

      <h1>CRM</h1>

      <nav id="app-nav">

        <button
          type="button"
          id="nav-clientes"
          class="nav-tab nav-tab-activo"
          onclick="AppUI.irAClientes()"
        >
          Clientes
        </button>

        <button
          type="button"
          id="nav-ventas"
          class="nav-tab"
          onclick="AppUI.irAVentas()"
        >
          Ventas
        </button>

        <button
          type="button"
          id="nav-notas"
          class="nav-tab"
          onclick="AppUI.irANotas()"
        >
          Notas
        </button>

      </nav>

    </header>


    <main id="app-content">

      <!-- ======================================================
           VISTA: CLIENTES
           ====================================================== -->

      <section
        id="vista-clientes"
        hidden
      >

        <div
          style="
            display:flex;
            justify-content:space-between;
            align-items:center;
            gap:12px;
            margin-bottom:16px;
          "
        >

          <h2 style="margin:0;">
            Clientes
          </h2>

          <button
            type="button"
            class="btn btn-primary"
            onclick="ClienteFormularioUI.mostrar()"
          >
            ＋ Nuevo
          </button>

        </div>


        <div class="form-group">

          <label
            class="form-label"
            for="buscar-clientes"
          >
            Buscar
          </label>

          <input
            type="search"
            id="buscar-clientes"
            placeholder="Nombre o celular"
            autocomplete="off"
            oninput="ClienteListaUI.filtrar()"
          >

        </div>


        <div id="lista-clientes">

          <div class="loading">
            Cargando clientes...
          </div>

        </div>

      </section>


      <!-- ======================================================
           VISTA: NUEVO CLIENTE
           ====================================================== -->

      <section
        id="vista-nuevoCliente"
        hidden
      >
      </section>


      <!-- ======================================================
           VISTA: FICHA
           ====================================================== -->

      <section
        id="vista-ficha"
        hidden
      >
      </section>


      <!-- ======================================================
           VISTA: NUEVO EVENTO
           ====================================================== -->

      <section
        id="vista-nuevoEvento"
        hidden
      >
      </section>


      <!-- ======================================================
           VISTA: VENTAS (listado global)
           ====================================================== -->

      <section
        id="vista-ventas"
        hidden
      >

        <div
          style="
            display:flex;
            justify-content:space-between;
            align-items:center;
            gap:12px;
            margin-bottom:16px;
          "
        >

          <h2 style="margin:0;">
            Ventas
          </h2>

          <button
            type="button"
            class="btn btn-primary"
            onclick="VentaFormularioUI.mostrar()"
          >
            ＋ Nueva
          </button>

        </div>


        <div class="form-group">

          <label
            class="form-label"
            for="buscar-ventas"
          >
            Buscar
          </label>

          <input
            type="search"
            id="buscar-ventas"
            placeholder="Cliente, factura o vehículo"
            autocomplete="off"
            oninput="VentaListaUI.filtrar()"
          >

        </div>


        <div id="lista-ventas">

          <div class="loading">
            Cargando ventas...
          </div>

        </div>

      </section>


      <!-- ======================================================
           VISTA: NOTAS (POSTITS)
           ====================================================== -->

      <section
        id="vista-notas"
        hidden
      >

        <div
          class="vista-notas"
        >

          <div
            class="vista-header"
          >

            <h2>Notas</h2>

            <div
              class="vista-controles"
            >

              <button
                type="button"
                class="btn btn-primary"
                onclick="PostitListaUI.nueva()"
              >
                Nueva Nota
              </button>

              <div
                class="campo-busqueda"
              >
                <input
                  type="text"
                  id="buscar-notas"
                  placeholder="🔍 Buscar notas..."
                  oninput="PostitListaUI.filtrar()"
                />
              </div>

            </div>

          </div>


          <div
            id="lista-notas"
            class="lista-notas"
          >
          </div>

          <!-- Formulario para crear nueva nota -->
          <div
            id="formulario-nota"
            class="modal"
            style="display: none;"
          >
            <div
              class="modal-contenido"
            >
              <h3>Nueva Nota</h3>
              
              <div
                class="campo-formulario"
              >
                <label for="descripcion">Descripción:</label>
                <textarea
                  id="descripcion"
                  rows="5"
                  placeholder="Escribe tu nota aquí..."
                  style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; resize: vertical;"
                ></textarea>
              </div>

              <div
                class="modal-acciones"
              >
                <button
                  type="button"
                  class="btn btn-primary"
                  onclick="PostitListaUI.guardarNota()"
                >
                  Guardar
                </button>
                <button
                  type="button"
                  class="btn btn-secondary"
                  onclick="PostitListaUI.cerrarFormulario()"
                >
                  Cancelar
                </button>
              </div>
            </div>
          </div>

        </div>

      </section>


      <!-- ======================================================
           VISTA: NUEVO POSTIT (FORMULARIO)
           ====================================================== -->

      <section
        id="vista-nuevoPostit"
        hidden
      >
      </section>


      <!-- ======================================================
           VISTA: NUEVA VENTA
           ====================================================== -->

      <section
        id="vista-nuevaVenta"
        hidden
      >
      </section>

    </main>

  </div>

</html>
